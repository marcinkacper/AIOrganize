<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="agy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>
    <linearGradient id="agy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>
    <filter id="agy-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#agy-bg)" stroke="#30363d" stroke-width="2.5"/>
  <!-- Antigravity orbit ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#agy-grad)" stroke-width="2.5" stroke-dasharray="88 44" stroke-linecap="round" filter="url(#agy-glow)"/>
  <!-- Upward levitation arrow / spark -->
  <path d="M32 16 L44 32 L36 32 L36 46 L28 46 L28 32 L20 32 Z" fill="url(#agy-grad)" filter="url(#agy-glow)"/>
  <!-- Central core energy point -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" filter="url(#agy-glow)"/>
</svg>
